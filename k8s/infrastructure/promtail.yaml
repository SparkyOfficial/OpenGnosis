---
# Promtail DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:2.9.3
        args:
        - -config.file=/etc/promtail/promtail.yaml
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: run
          mountPath: /run/promtail
        - name: containers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: run
        hostPath:
          path: /run/promtail
      - name: containers
        hostPath:
          path: /var/lib/docker/containers
      - name: pods
        hostPath:
          path: /var/log/pods
      tolerations:
      - effect: NoSchedule
        operator: Exists
---
# Promtail Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
# Promtail ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - watch
  - list
---
# Promtail ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail
  namespace: monitoring
---
# Promtail Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /run/promtail/positions.yaml
    
    clients:
      - url: http://loki:3100/loki/api/v1/push
        tenant_id: opengnosis
    
    scrape_configs:
    # Scrape OpenGnosis application logs
    - job_name: opengnosis-pods
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - opengnosis
      
      pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            trace_id: traceId
            span_id: spanId
            thread: thread
            app: app
      
      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      # Add labels
      - labels:
          level:
          logger:
          trace_id:
          span_id:
          app:
      
      # Output format
      - output:
          source: message
      
      relabel_configs:
      # Add namespace label
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      
      # Add pod name label
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      
      # Add container name label
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
      
      # Add app label from pod labels
      - source_labels:
        - __meta_kubernetes_pod_label_app
        target_label: app
      
      # Add node name label
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
      
      # Only scrape running pods
      - source_labels:
        - __meta_kubernetes_pod_phase
        action: keep
        regex: Running
    
    # Scrape infrastructure logs (Kafka, PostgreSQL, etc.)
    - job_name: infrastructure-pods
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - opengnosis
      
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app
        action: keep
        regex: (kafka|postgresql|redis|elasticsearch)
      
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
      
      - source_labels:
        - __meta_kubernetes_pod_label_app
        target_label: app
    
    # Scrape Istio sidecar logs
    - job_name: istio-sidecars
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - opengnosis
      
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_container_name
        action: keep
        regex: istio-proxy
      
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      
      - source_labels:
        - __meta_kubernetes_pod_label_app
        target_label: app
      
      - replacement: istio-proxy
        target_label: container
