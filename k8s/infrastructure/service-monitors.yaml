---
# ServiceMonitor for gnosis-api-gateway
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gnosis-api-gateway
  namespace: opengnosis
  labels:
    team: opengnosis
    app: gnosis-api-gateway
spec:
  selector:
    matchLabels:
      app: gnosis-api-gateway
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
