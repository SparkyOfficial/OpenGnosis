apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnosis-iam
spec:
  template:
    spec:
      containers:
      - name: gnosis-iam
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200"
---
