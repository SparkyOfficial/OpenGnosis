apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opengnosis-prod

namePrefix: prod-

commonLabels:
  environment: production

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - configmap-patch.yaml
  - hpa.yaml

replicas:
  - name: gnosis-iam
    count: 3
  - name: gnosis-api-gateway
    count: 3
  - name: gnosis-structure
    count: 2
  - name: gnosis-scheduler
    count: 2
  - name: gnosis-journal-command
    count: 3
  - name: gnosis-analytics-query
    count: 3
  - name: gnosis-notifier
    count: 2
