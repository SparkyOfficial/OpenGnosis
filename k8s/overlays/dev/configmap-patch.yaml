apiVersion: v1
kind: ConfigMap
metadata:
  name: opengnosis-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.opengnosis-dev.svc.cluster.local:9092"
  POSTGRES_HOST: "postgres.opengnosis-dev.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "opengnosis_dev"
  REDIS_HOST: "redis.opengnosis-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: "http://elasticsearch.opengnosis-dev.svc.cluster.local:9200"
