# PostgreSQL destination rule (infrastructure)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgresql
  namespace: opengnosis
spec:
  host: postgresql.opengnosis.svc.cluster.local
  trafficPolicy:
    # Use plain text for PostgreSQL (no mTLS as it has its own authentication)
    tls:
      mode: DISABLE
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 10s
---
