# Scheduler Service VirtualService
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gnosis-scheduler
  namespace: opengnosis
spec:
  hosts:
    - gnosis-scheduler.opengnosis.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/api/v1/schedules/optimize"
      route:
        - destination:
            host: gnosis-scheduler.opengnosis.svc.cluster.local
            port:
              number: 8080
      timeout: 60s  # Extended timeout for optimization
      retries:
        attempts: 1
        perTryTimeout: 60s
    - route:
        - destination:
            host: gnosis-scheduler.opengnosis.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
